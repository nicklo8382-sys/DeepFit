; DeepFit - code-driven SMP Head mouth for oral scenes.
; Every frame the lip / corner / nose / throat bones of any actor that has the SMP Head mouth
; bones are pushed out to the surface of a nearby actor's schlong mesh. No physics involved.
; Reload: restart the game (or change them in the SKSE Menu Framework: DeepFit > Mouth, applied at once).

Enabled = 1
DebugLog = 0                 ; 1 = write per-second bone positions to DeepFit.log

MaxPartnerDistance = 150     ; units from receiver head to partner before we look at their schlong
SmoothSpeed = 25             ; higher = bones snap to the shaft faster (1/s)
CacheRefreshSeconds = 2      ; how often schlong meshes are re-scanned (equip / morph changes)

; ---- lips (units are nif units, ~1 = 1.4 cm)
LipMargin = 0.08             ; gap kept between lip surface and shaft surface
LipDepthSlab = 0.8           ; shaft vertices within +- this of the lip plane count for the lips
LipLaneWidth = 0.6           ; shaft vertices within +- this across the lip count for each lip bone
UpperLipMax = 1.50           ; max lift of the upper lip bones
LowerLipMax = 2.20           ; max drop of the lower lip bones
CornerMax = 1.20             ; max sideways spread of the mouth corners
Stretch = 0.00               ; 0.1.4: lips pushed this much past the shaft surface (stretched round it)
MinOpen = 1.20               ; 0.1.4: with a shaft in his mouth every lip opens at least this far
MinCorner = 0.80             ; 0.1.4: ... and each corner spreads at least this far
NoseFollow = 0.5             ; nose base lifts by this fraction of the upper-lip lift
NoseMax = 0.5

; ---- throat bulge (needs the shaft deep enough to reach the throat bones)
ThroatEnabled = 0
ThroatSkinOffset = 1.5       ; distance from the throat bones to the skin surface
ThroatMargin = 0.2
ThroatGain = 2.50            ; throat weights peak ~0.37, so the bone push is scaled up
ThroatMax = 0.00
ThroatSlabZ = 1.2
ThroatSlabX = 2.0

; ---- the mouth itself (0.2.0): SMP Head's MFEE morphs PPA_JawWide / PPA_LipStretch / PPA_LipWiden / PPA_TH1-3.
; DeepFit opens the mouth to the shaft's thickness where it passes the lips (and lets it close again round a
; slimmer part, or a different man), and the lip bones then fit the lips to it. PPA no longer touches the mouth.
MouthMorphs = 1              ; 0 = leave these morphs to PPA / another mod
MegaMouth = 0                ; 1 = as wide as the morphs go, whatever the shaft (MorphMax)
MegaKey = 0                  ; 0.3.0: a key that switches Mega mouth on / off in game (set it in the menu by pressing it; 0 = none)
MouthExtra = 3.00            ; opened this much more than the shaft is thick
JawUnits = 10.00             ; how far PPA_JawWide at 100 opens the jaw (lower = opens wider for the same shaft)
LipUnits = 8.00              ; how far PPA_LipStretch at 100 rounds the lips out
WidenUnits = 5.00            ; how far PPA_LipWiden at 100 spreads each corner
MorphMax = 300.00            ; the most any morph is set to (MFEE's own Max in MuFacialExpressionExtended.ini caps it too)
MorphLerpMs = 120            ; MFEE blend time for each change
ThroatMorphs = 0             ; the old ridge: PPA_TH1-3 together, by how deep the tip is (0.3.5: off - DF_Throat1-5 instead)
ThroatMorphMax = 120.00      ; 0.3.4: how strong the throat ridge gets (MorphMax still caps it)
ThroatFrom = 5.00            ; how far past the lips the top of his throat is (the throat starts to swell there)
ThroatFull = 14.00           ; 0.3.4: the whole ridge is out this deep
LipRound = 0.60              ; 0.3.8: how much the lips round forward (the rest of the opening goes to the sides; 1 = the old pucker)
MouthWideGain = 1.00         ; 0.3.8: how far the corners of the mouth go out to the sides, per unit needed
MouthWideMax = 1.80          ; 0.3.8: the most each corner goes out (units)
CornerOpen = 0.12            ; 0.3.8: the corners also go out by this share of how far the mouth is open
GuessRigs = 1                ; 0.4.0: a skeleton DeepFit does not know: its schlong bones are guessed from their names
AnyMeshAtLips = 0            ; 0.4.0: still nothing found: any of the partner's mesh that reaches the lips counts (heavier; off by default)
ThroatAxisFit = 1            ; 0.4.0: measure the shaft along its own line (angled or bent shafts read their real thickness)
CheekGain = 1.00             ; 0.4.0: a shaft pushed to one side bulges that cheek (0 = off)
CheekMax = 1.20              ; 0.4.0: the most a cheek bulges (units)
CheekInner = 1.60            ; 0.4.0: room inside his mouth to each side before the cheek is pushed
GulpSize = 1.20              ; 0.4.0: a swallow running down his throat with each of Anatomica's gulps (units; 0 = off)
GulpTime = 0.70              ; 0.4.0: seconds it takes from his chin to his neck
GagJaw = 25.00               ; 0.4.0: a gag (Anatomica) drops his jaw this much more
GagSqueeze = 0.40            ; 0.4.0: and tightens his throat by this share
GagTime = 0.90               ; 0.4.0: how long the gag lasts (seconds)
ShapeRidge = 0.60            ; 0.4.0: a ridged schlong's ridge down his throat (units; Anatomica tells DeepFit the shape)
ShapeKnob = 0.70             ; 0.4.0: a segmented schlong's knobs down his throat (units)
MalesOnly = 1                ; 0.3.7: only men's mouths are fitted (women keep SMP Head's own physics and PPA)
ThroatShape = 1              ; 0.3.5: the throat follows the schlong's own shape (needs the DF_Throat morphs in PPA_HPH_Male.tri)
ThroatBand = 0.60            ; 0.3.5: units of shaft per throat band (10 bands, from ThroatFrom deep)
ThroatFill = 1.00            ; 0.3.5: how far out onto the chin-to-neck line the throat fills where the shaft is (0-1)
ThroatRest = 0.60            ; 0.3.5: half thickness an empty throat takes without bulging
ThroatShapeGain = 1.60       ; 0.3.5: units of bulge per unit of thickness past ThroatRest
ThroatShapeMax = 3.00        ; 0.3.5: the most a band bulges (units)
ThroatWideUnits = 1.40       ; 0.3.5: a shaft this much wider than tall (half width) spreads the bulge fully sideways
ThroatWideExtra = 0.30       ; 0.3.6: every bulge this much wider anyway (0 = as wide as the shaft, 1 = most of his neck)
ThroatMotion = 0.40          ; 0.3.6: a ripple that slides along his throat with every stroke (units; 0 = off)
ThroatMotionLength = 2.00    ; 0.3.6: its length along the shaft (units)
ThroatDetail = 1.60          ; 0.3.6: a flare / ring / knot this many times more pronounced than the shaft's own shape
TeethOpen = 1                ; the SMP Head teeth-open modifier while the shaft is in his mouth
TeethHide = 0                ; 0.4.6: his teeth and tongue hidden while he is in a scene (the head profiles of beast heads turn it on)
TeethMove = 1                ; 0.4.0: teeth moved down / back: 0 off, 1 while the mouth is full, 2 the whole scene (0.4.2); back where they belong outside scenes
TeethDown = 0.30             ; units down
TeethBack = 0.30             ; units back (into his mouth)
TeethParts = teeth, mouth    ; the face parts that count as teeth (part of their name, comma separated; vanilla's is MaleMouthHumanoidDefault)
DetectShapes = 1             ; 0.4.4: without Anatomica, DeepFit finds the schlong's shape itself (keyword, name, race); with Anatomica, Anatomica says
ShapeFlare = 0.80            ; a flared head swells this much more just behind the tip (units)
ShapeKnotOpen = 1.50         ; a knot all the way in opens his mouth this much more (units)
ExtraPush = 1                ; 0.4.4: now and then, at the deepest point of a stroke, the bulge goes further down his throat
ExtraDepth = 4.00            ; ... this many units deeper
ExtraChance = 0.25           ; ... the chance each stroke (1 = every stroke)
ExtraHold = 0.80             ; ... seconds it stays there
ExtraSwell = 0.60            ; 0.4.5: ... and the throat swells this much more meanwhile (units)
SoundGulp = 0.80             ; 0.4.4: volume of a swallow (0 = off) - WAV / XWM files in Data\Sound\Fx\DeepFit\gulp (else Anatomica's gulps)
SoundGag = 0.80              ; a gag (Data\Sound\Fx\DeepFit\gag)
SoundGasp = 0.60             ; a breath after he pulls out (Data\Sound\Fx\DeepFit\gasp)
SoundOwnOnly = 1             ; only DeepFit's own swallows and gags (Anatomica plays its own)
FaceReact = 1                ; 0.4.0: his eyes close and brows lift the deeper it goes; eyes clench and brows knit in a gag
FaceEyes = 0.50
FaceBrows = 0.40
FaceGag = 0.80
LipDrag = 0.35               ; 0.4.0: lips roll out as he pulls back and tuck in as he pushes in (units)
LipDragSpeed = 20.00         ; the stroke speed (units a second) for the full drag
RecoverHold = 1.00           ; 0.4.0: after he pulls out his mouth stays open this long (seconds) ...
RecoverOpen = 0.35           ; ... this share of how open it was ...
RecoverGulp = 1              ; ... then he swallows
AutoGagGulp = 1              ; 0.4.0: gags and swallows by DeepFit itself (Anatomica's own come first)
AutoDeep = 4.00              ; this far past the top of his throat counts as deep (units)
AutoGagSpeed = 25.00         ; a deep thrust this fast (units a second) makes him gag
AutoGagCooldown = 3.00       ; seconds between gags
AutoGulpHold = 1.50          ; held deep this long (seconds) and he swallows
RaceStrength =               ; 0.4.0: per race of the partner, e.g. WerewolfBeastRace:0.80, OtherRace:1.20 (set in the menu)
LipCloseMax = 2.00           ; lips may close in this far round a slim shaft
MegaKeyMods = 0                ; 0.3.1: Shift 1 / Ctrl 2 / Alt 4 held with the key (added up)
UpperLipDown = 0.60           ; 0.3.3: the upper lip pulled down this far while the mouth is full
UpperLipClose = 1.00         ; 0.4.5: the upper lip comes down onto a shaft lower than it this many times harder (its bones are half weighted - 2 = about right)
LowerLipRound = 0.50         ; 0.4.4: the lower lip's sides pushed out and down as the jaw opens - a round opening, not a diamond (units at a full jaw)
LowerLipUp = 0.00            ; 0.4.1: the lower lip pushed up this far while the mouth is full
ReadAfterPPA = 1             ; 0.4.5: his schlong read where PPA aims it (as the last frame ended), not as the animation has it
FollowAim = 1                ; 0.4.3: PPA bends his schlong into the mouth after DeepFit reads it: a shaft whose line passes his lips is turned onto them too
AimRadius = 10.00            ; ... when its line passes within this many units of his lips
AimMaxDeg = 45.00            ; ... turned at most this many degrees
LipsAlongShaft = 1           ; 0.4.1: the mouth opens to the shaft measured straight across it (0 = up and down his face, as before)
