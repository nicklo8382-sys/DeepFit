; DeepFit - code-driven SMP Head mouth for oral scenes.
; Every frame the lip / corner / nose / throat bones of any actor that has the SMP Head mouth
; bones are pushed out to the surface of a nearby actor's schlong mesh. No physics involved.
; Reload: restart the game.

Enabled = 1
DebugLog = 0                 ; 1 = write per-second bone positions to DeepFit.log

MaxPartnerDistance = 150     ; units from receiver head to partner before we look at their schlong
SmoothSpeed = 25             ; higher = bones snap to the shaft faster (1/s)
CacheRefreshSeconds = 2      ; how often schlong meshes are re-scanned (equip / morph changes)

; ---- lips (units are nif units, ~1 = 1.4 cm)
LipMargin = 0.08             ; gap kept between lip surface and shaft surface
LipDepthSlab = 0.8           ; shaft vertices within +- this of the lip plane count for the lips
LipLaneWidth = 0.6           ; shaft vertices within +- this across the lip count for each lip bone
UpperLipMax = 1.6            ; max lift of the upper lip bones
LowerLipMax = 2.2            ; max drop of the lower lip bones
CornerMax = 1.2              ; max sideways spread of the mouth corners
NoseFollow = 0.5             ; nose base lifts by this fraction of the upper-lip lift
NoseMax = 0.5

; ---- throat bulge (needs the shaft deep enough to reach the throat bones)
ThroatEnabled = 1
ThroatSkinOffset = 1.5       ; distance from the throat bones to the skin surface
ThroatMargin = 0.2
ThroatGain = 2.5             ; throat weights peak ~0.37, so the bone push is scaled up
ThroatMax = 4.0
ThroatSlabZ = 1.2
ThroatSlabX = 2.0
