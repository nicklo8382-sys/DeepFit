; DeepFit - code-driven SMP Head mouth for oral scenes.
; Every frame the lip / corner / nose / throat bones of any actor that has the SMP Head mouth
; bones are pushed out to the surface of a nearby actor's schlong mesh. No physics involved.
; Reload: restart the game (or change them in the SKSE Menu Framework: DeepFit > Mouth, applied at once).

Enabled = 1
DebugLog = 0                 ; 1 = write per-second bone positions to DeepFit.log

MaxPartnerDistance = 150     ; units from receiver head to partner before we look at their schlong
SmoothSpeed = 25             ; higher = bones snap to the shaft faster (1/s)
CacheRefreshSeconds = 2      ; how often schlong meshes are re-scanned (equip / morph changes)

; ---- lips (units are nif units, ~1 = 1.4 cm)
LipMargin = 0.08             ; gap kept between lip surface and shaft surface
LipDepthSlab = 0.8           ; shaft vertices within +- this of the lip plane count for the lips
LipLaneWidth = 0.6           ; shaft vertices within +- this across the lip count for each lip bone
UpperLipMax = 1.50           ; max lift of the upper lip bones
LowerLipMax = 2.20           ; max drop of the lower lip bones
CornerMax = 1.20             ; max sideways spread of the mouth corners
Stretch = 0.00               ; 0.1.4: lips pushed this much past the shaft surface (stretched round it)
MinOpen = 1.20               ; 0.1.4: with a shaft in his mouth every lip opens at least this far
MinCorner = 0.80             ; 0.1.4: ... and each corner spreads at least this far
NoseFollow = 0.5             ; nose base lifts by this fraction of the upper-lip lift
NoseMax = 0.5

; ---- throat bulge (needs the shaft deep enough to reach the throat bones)
ThroatEnabled = 0
ThroatSkinOffset = 1.5       ; distance from the throat bones to the skin surface
ThroatMargin = 0.2
ThroatGain = 2.50            ; throat weights peak ~0.37, so the bone push is scaled up
ThroatMax = 0.00
ThroatSlabZ = 1.2
ThroatSlabX = 2.0

; ---- the mouth itself (0.2.0): SMP Head's MFEE morphs PPA_JawWide / PPA_LipStretch / PPA_LipWiden / PPA_TH1-3.
; DeepFit opens the mouth to the shaft's thickness where it passes the lips (and lets it close again round a
; slimmer part, or a different man), and the lip bones then fit the lips to it. PPA no longer touches the mouth.
MouthMorphs = 1              ; 0 = leave these morphs to PPA / another mod
MegaMouth = 0                ; 1 = as wide as the morphs go, whatever the shaft (MorphMax)
MegaKey = 0                  ; 0.3.0: a key that switches Mega mouth on / off in game (set it in the menu by pressing it; 0 = none)
MouthExtra = 3.00            ; opened this much more than the shaft is thick
JawUnits = 10.00             ; how far PPA_JawWide at 100 opens the jaw (lower = opens wider for the same shaft)
LipUnits = 8.00              ; how far PPA_LipStretch at 100 rounds the lips out
WidenUnits = 5.00            ; how far PPA_LipWiden at 100 spreads each corner
MorphMax = 300.00            ; the most any morph is set to (MFEE's own Max in MuFacialExpressionExtended.ini caps it too)
MorphLerpMs = 120            ; MFEE blend time for each change
ThroatMorphs = 1             ; PPA_TH1-3 by how deep the tip is (5 / 8.5 / 12 units)
TeethOpen = 1                ; the SMP Head teeth-open modifier while the shaft is in his mouth
LipCloseMax = 2.00           ; lips may close in this far round a slim shaft
MegaKeyMods = 0                ; 0.3.1: Shift 1 / Ctrl 2 / Alt 4 held with the key (added up)
UpperLipDown = 0.60           ; 0.3.3: the upper lip pulled down this far while the mouth is full
