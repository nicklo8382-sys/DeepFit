; DeepFit head profile - the Argonian High Poly Head built for DeepFit (its mouth bones and weights).
; [Head] says which heads use it, [Bones] how its bones push, [Settings] its own settings (the
; "Argonian (High Poly Head)" drop-down at the bottom of each DeepFit page writes them here).

[Head]
Name = Argonian (High Poly Head)
Races = ArgonianRace, ArgonianRaceVampire
HeadMeshes = maleheadargonian.nif
Sex = male
; its jaw opens with its own jaw-open shape (a phoneme) - his teeth and tongue go with it - and DeepFit's PPA_JawWide
; drops it 40% further on top (the teeth are hidden in scenes: TeethHide below)
JawPhoneme = BigAah
; how far his lower lip drops with the jaw fully open (units) - the test page centres its schlong in the opening
JawDrop = 5.3
; its morphs (lips, corners, throat): Actors\Character\FaceGenMorphs\Morphs\DeepFit (an MFEE extension of its head)

[Bones]
; bone name = kind (Lip, Corner, Nose, Throat, Cheek), push direction: x (his right), y (forward), z (up)
; a snout grips: the lips round the shaft come straight down / up onto it (a little out to the side), not the human
; spread - the side lips and the Muzzle bones (on the lip edges where the shaft's sides are)
Upper Lip Left = Lip, -0.3, 0, 0.95
Upper Lip Right = Lip, 0.3, 0, 0.95
Bottom Lip Left = Lip, -0.3, 0, -0.95
Bottom Lip Right = Lip, 0.3, 0, -0.95
Muzzle Upper Left = Lip, -0.45, 0, 0.9
Muzzle Upper Right = Lip, 0.45, 0, 0.9
Muzzle Lower Left = Lip, -0.45, 0, -0.9
Muzzle Lower Right = Lip, 0.45, 0, -0.9
Muzzle Jaw Left = Lip, -0.3, 0, -0.95
Muzzle Jaw Right = Lip, 0.3, 0, -0.95

[Settings]
; his long snout: the throat starts about 2.3 units deeper than a man's, and its line is 1.3 times as long
ThroatFrom = 8.40
ThroatBand = 2.39
; the jaw drops past his teeth: hidden in scenes
TeethHide = 1
; his upper snout comes down onto the shaft as the jaw opens (DF_UpperJawDown; 1 = 10 degrees)
UpperJawDown = 0.60
