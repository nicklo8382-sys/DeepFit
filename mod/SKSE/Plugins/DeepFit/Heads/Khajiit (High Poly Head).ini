; DeepFit head profile - the Khajiit High Poly Head built for DeepFit (its mouth bones and weights).
; [Head] says which heads use it, [Bones] how its bones push, [Settings] its own settings (the
; "Khajiit (High Poly Head)" drop-down at the bottom of each DeepFit page writes them here).

[Head]
Name = Khajiit (High Poly Head)
Races = KhajiitRace, KhajiitRaceVampire
HeadMeshes = maleheadkhajiit.nif
Sex = male
; its jaw opens with its own jaw-open shape (a phoneme) - that opens his teeth and tongue with it
JawPhoneme = BigAah
; its morphs (lips, corners, throat): Actors\Character\FaceGenMorphs\Morphs\DeepFit (an MFEE extension of its head)

[Bones]
; bone name = kind (Lip, Corner, Nose, Throat, Cheek), push direction: x (his right), y (forward), z (up)
; a short muzzle: the lips push like a man's (DeepFit's own directions); the jaw bones by the corners up / down
Muzzle Upper Left = Lip, -0.3, 0, 0.95
Muzzle Upper Right = Lip, 0.3, 0, 0.95
Muzzle Lower Left = Lip, -0.3, 0, -0.95
Muzzle Lower Right = Lip, 0.3, 0, -0.95

[Settings]
; his muzzle: the throat starts about 1.5 units deeper than a man's, and its line is 1.1 times as long
ThroatFrom = 7.60
ThroatBand = 2.05
