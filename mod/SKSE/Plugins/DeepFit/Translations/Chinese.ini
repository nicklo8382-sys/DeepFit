; DeepFit menu - Chinese

en: DeepFit moves the mouth of SMP Head (High Poly Head) actors to fit the shaft in it. Changes apply at once and are saved to DeepFit.ini.
tr: DeepFit 会让 SMP Head（High Poly Head）角色的嘴贴合其中的阴茎。更改立即生效，并保存到 DeepFit.ini。

en: Enabled
tr: 启用

en: Men only
tr: 仅限男性

en: Only men's mouths are fitted. Off: any head with the SMP Head mouth bones - it needs a head built for DeepFit (its mouth bones, weights and throat morphs) to look right.
tr: 只调整男性的嘴。关闭：任何带有 SMP Head 嘴部骨骼的头部都会被调整——需要为 DeepFit 制作的头部（嘴部骨骼、权重和喉咙变形）才能显示正常。

en: Presets
tr: 预设

en: Subtle
tr: 轻微

en: Default
tr: 默认

en: Extreme
tr: 夸张

en: Sets the throat, mouth-width, cheek, gulp and shape sliders together. Fine-tune them below afterwards.
tr: 一次设置喉咙、嘴宽、脸颊、吞咽和形状滑块。之后可在下方微调。

en: Test (no scene needed)
tr: 测试（无需场景）

en: Show a test schlong in my mouth
tr: 在我嘴里显示测试用阴茎

en: A made-up schlong goes into the player's mouth, so you can tune the mouth and throat here without starting a scene. Not saved - switch it off when done. Needs a head built for DeepFit on the player.
tr: 一根虚拟的阴茎会进入玩家的嘴里，这样无需开始场景就能在这里调整嘴和喉咙。不会保存——调完请关闭。玩家需要使用为 DeepFit 制作的头部。

en: Tip depth
tr: 顶端深度

en: Half its height
tr: 高度的一半

en: Half its width
tr: 宽度的一半

en: Shape:
tr: 形状：

en: Goes in and out
tr: 来回抽送

en: Mouth
tr: 嘴

en: Mega mouth
tr: 超大张嘴

en: As wide as the mouth morphs go, whatever the shaft. Off: the mouth opens to the shaft's own thickness where it passes the lips, and closes again round a slimmer part.
tr: 无论阴茎粗细，嘴都张到变形的最大。关闭：嘴按阴茎经过嘴唇处的粗细张开，遇到较细的部分会再合拢。

en: Mega mouth key: press the key now (Esc to cancel)
tr: 超大张嘴按键：现在按下按键（Esc 取消）

en: Mega mouth key:
tr: 超大张嘴按键：

en: Set key
tr: 设置按键

en: No key
tr: 无按键

en: Switches Mega mouth on and off in game. Press Set key, then the key - hold Shift, Ctrl and / or Alt with it for a combination (e.g. Alt+Shift+G). The key's switch is not saved; the key is.
tr: 在游戏中开关超大张嘴。点击“设置按键”，然后按下按键——同时按住 Shift、Ctrl 和/或 Alt 可设为组合键（如 Alt+Shift+G）。按键切换的状态不保存，按键本身会保存。

en: DeepFit opens the mouth
tr: 由 DeepFit 张开嘴

en: DeepFit drives the SMP Head mouth morphs (PPA_JawWide, PPA_LipStretch, PPA_LipWiden) and its own. Off: only the lip bones move, and the morphs are left to PPA or another mod.
tr: DeepFit 驱动 SMP Head 的嘴部变形（PPA_JawWide、PPA_LipStretch、PPA_LipWiden）以及它自己的变形。关闭：只移动嘴唇骨骼，变形交给 PPA 或其他模组。

en: Room round the shaft
tr: 阴茎周围的空隙

en: The mouth opens this much more than the shaft is thick.
tr: 嘴比阴茎的粗细多张开这么多。

en: Jaw (units per 100)
tr: 下巴（每 100 的单位）

en: How far the jaw morph at 100 opens the jaw. Lower = the jaw opens wider for the same shaft.
tr: 下巴变形为 100 时张开的距离。越低 = 同样的阴茎下巴张得越大。

en: Lips round (units per 100)
tr: 嘴唇撅圆（每 100 的单位）

en: Corners spread (units per 100)
tr: 嘴角张开（每 100 的单位）

en: Most a morph is set to
tr: 变形的最大值

en: MFEE caps the morphs too: its Max in MuFacialExpressionExtended.ini (100 as installed). Raise both for more than the morph's full size.
tr: MFEE 也会限制变形：MuFacialExpressionExtended.ini 中的 Max（安装时为 100）。想超过变形的完整大小，需要同时提高两者。

en: Lips
tr: 嘴唇

en: Stretch past the shaft
tr: 超出阴茎的拉伸

en: Close in round a slim shaft
tr: 围绕细阴茎收拢

en: Upper lip, at most
tr: 上唇最多

en: Upper lip down
tr: 上唇下压

en: While the mouth is full the upper lip is pulled down this far (its middle fully, the sides a little less) - the lip-round morph peaks it up towards the nose.
tr: 嘴里塞满时上唇被向下拉这么远（中间完全，两侧稍少）——撅唇变形会把它向鼻子顶起。

en: Lower lip, at most
tr: 下唇最多

en: Corners, at most
tr: 嘴角最多

en: Mouth opens to the sides
tr: 嘴向两侧张开

en: The corners of his mouth pull out to the sides to the schlong's width (DeepFit's DF_MouthWide morph), so the mouth opens wide round it instead of puckering.
tr: 他的嘴角按阴茎的宽度向两侧拉开（DeepFit 的 DF_MouthWide 变形），让嘴围着它大张，而不是撅成圆形。

en: Corners out, at most
tr: 嘴角外张最多

en: Corners out with the jaw
tr: 嘴角随下巴外张

en: Lips round forward
tr: 嘴唇向前撅

en: How much the lips push forward into an O. Lower = less of a pucker, more of a wide-open mouth (1 = as before 0.3.8).
tr: 嘴唇向前撅成 O 形的程度。越低 = 越少撅嘴、越像大张的嘴（1 = 与 0.3.8 之前相同）。

en: Cheek bulge
tr: 脸颊鼓起

en: A shaft pushed to one side of his mouth bulges that cheek out (SMP Head's cheek bones). 0 = off.
tr: 阴茎顶向嘴的一侧时，那一侧的脸颊会鼓起（SMP Head 的脸颊骨骼）。0 = 关闭。

en: Cheek, at most
tr: 脸颊最多

en: Room before the cheek
tr: 脸颊前的空隙

en: Throat and teeth
tr: 喉咙和牙齿

en: Throat bulge, by the schlong's shape
tr: 喉咙鼓起，按阴茎的形状

en: DeepFit's own throat morphs: ten thin bands down the front of his throat, from under his chin to just above the neck seam. Where the shaft is, the throat fills out to a straight line from chin to neck, then swells past it by how thick that part of the schlong is, so a flared head, a medial ring or a knot shows as it goes down.
tr: DeepFit 自己的喉咙变形：沿他喉咙前侧的十条窄带，从下巴下方到颈部接缝上方。阴茎所在处，喉咙先鼓到从下巴到脖子的直线，再按阴茎那一段的粗细继续鼓起，所以张开的龟头、中环或结会随着深入显现出来。

en: Throat starts at
tr: 喉咙开始于

en: How far past his lips the schlong has to be to reach the top of his throat (under his chin).
tr: 阴茎要越过嘴唇多远才能到达喉咙顶部（下巴下方）。

en: Shaft per band
tr: 每条带对应的阴茎长度

en: How much of the shaft's length each of the ten bands stands for (smaller = the throat shows a shorter stretch of it, in more detail).
tr: 十条带中每条代表阴茎的多少长度（越小 = 喉咙显示的阴茎越短、细节越多）。

en: Fill out to the line
tr: 鼓到直线

en: Room in an empty throat
tr: 空喉咙的空隙

en: A schlong thinner than this (half its thickness, in units) passes without a bulge.
tr: 比这更细的阴茎（粗细的一半，单位）通过时不会鼓起。

en: Bulge per thickness
tr: 每单位粗细的鼓起

en: Shape stands out
tr: 形状突出

en: A flared head, medial ring or knot this many times more pronounced than the shaft itself (1 = exactly as the schlong is shaped).
tr: 张开的龟头、中环或结比阴茎本身明显这么多倍（1 = 完全按阴茎的形状）。

en: Bulge, at most
tr: 鼓起最多

en: Wider
tr: 更宽

en: Every bulge spreads further across his neck as soft shoulders round the shaft's own ridge (0 = as wide as the shaft, 1 = most of the front of his neck).
tr: 每个鼓起都以柔和的肩部围绕阴茎本身的隆起，在他脖子上铺得更宽（0 = 与阴茎同宽，1 = 脖子前侧的大部分）。

en: Moves with each stroke
tr: 随每次抽送移动

en: A soft ripple that slides along his throat as the shaft goes in and out, so it still moves when his throat is as full as it gets.
tr: 阴茎进出时，一道柔和的波纹沿他的喉咙滑动，所以即使喉咙已经塞满也仍在动。

en: Ripple length
tr: 波纹长度

en: Spreads fully sideways at
tr: 完全向两侧铺开于

en: A schlong wider than it is tall spreads the bulge out to the sides; this much wider (half width over half height) spreads it all the way.
tr: 宽度大于高度的阴茎会让鼓起向两侧铺开；宽出这么多（半宽减半高）时完全铺开。

en: Measure along the shaft
tr: 沿阴茎测量

en: Measures the shaft along its own line, so one that goes in at an angle or bends reads its real thickness. Off: sliced straight back from his lips.
tr: 沿阴茎自身的走向测量，所以斜着进入或弯曲的阴茎也能读出真实粗细。关闭：从嘴唇笔直向后切片测量。

en: Ridged schlong's ridge
tr: 带棱阴茎的棱

en: Segmented schlong's knobs
tr: 分节阴茎的结节

en: Anatomica tells DeepFit when the schlong is ridged or segmented (the same shape its belly bulge uses); its ridge or knobs then show down his throat.
tr: Anatomica 会告诉 DeepFit 阴茎是否带棱或分节（与腹部鼓起使用的形状相同）；它的棱或结节就会显现在他的喉咙上。

en: Swallow
tr: 吞咽

en: Each of Anatomica's gulps (when he swallows a finish) runs down his throat as a ripple. 0 = off.
tr: Anatomica 的每次吞咽（他咽下射出的精液时）都会以波纹的形式沿喉咙向下滑。0 = 关闭。

en: Swallow time
tr: 吞咽时间

en: Gag: jaw drops
tr: 作呕：下巴下沉

en: When Anatomica makes him gag, his jaw drops a little further and his throat tightens for a moment.
tr: Anatomica 让他作呕时，他的下巴会再张开一点，喉咙会短暂收紧。

en: Gag: throat tightens
tr: 作呕：喉咙收紧

en: Teeth part while the mouth is full
tr: 嘴里塞满时牙齿分开

en: Other mods
tr: 其他模组

en: Other mods can switch Mega mouth with a mod event: SendModEvent("DeepFit_MegaMouth", "", 1.0) on, 0.0 off, -1.0 back to the setting here. "DeepFit_Mouth" the same for DeepFit opening the mouth at all.
tr: 其他模组可以用模组事件切换超大张嘴：SendModEvent("DeepFit_MegaMouth", "", 1.0) 开启，0.0 关闭，-1.0 恢复为这里的设置。"DeepFit_Mouth" 同理，控制 DeepFit 是否张开嘴。

en: Debug log
tr: 调试日志

en: Reset to defaults
tr: 恢复默认

en: Every setting on this page back to as installed (your Mega mouth key and the debug log stay). Each slider's default sits in the middle of its range.
tr: 本页所有设置恢复为安装时的值（超大张嘴按键和调试日志保留）。每个滑块的默认值位于其范围的中间。

en: %.1f units past the lips
tr: 越过嘴唇 %.1f 单位

en: x%.2f
tr: x%.2f

en: %.1f units
tr: %.1f 单位

en: x%.1f
tr: x%.1f

