tr: 头部

en: No head profiles - every head uses DeepFit's own bones and the settings above.
tr: 没有头部配置——所有头部都使用 DeepFit 自带的骨骼和上面的设置。

en: bones set
tr: 根骨骼已设置

en: Reload head files
tr: 重新读取头部文件

en: Each head DeepFit fits can have a profile: a file in Data\SKSE\Plugins\DeepFit\Heads. It names the races (or head meshes) it is for, the head's bones and which way each pushes, and keeps that head's own settings (the drop-downs at the bottom of each page). To add a head, copy one of the files, change it and press Reload - nothing needs compiling. Heads without a profile use the settings above.
tr: DeepFit 适配的每种头部都可以有一个配置：Data\SKSE\Plugins\DeepFit\Heads 中的一个文件。它写明适用的种族（或头部模型）、头部的骨骼及每根骨骼的推动方向，并保存该头部自己的设置（每页底部的下拉菜单）。要添加头部，复制其中一个文件，修改后按“重新读取”——无需编译。没有配置的头部使用上面的设置。
