; DeepFit menu - Chinese

en: DeepFit moves the mouth of SMP Head (High Poly Head) actors to fit the shaft in it. Changes apply at once and are saved to DeepFit.ini.
tr: DeepFit 会让 SMP Head（High Poly Head）角色的嘴贴合其中的阴茎。更改立即生效，并保存到 DeepFit.ini。

en: Enabled
tr: 启用

en: Men only
tr: 仅限男性

en: Only men's mouths are fitted. Off: any head with the SMP Head mouth bones - it needs a head built for DeepFit (its mouth bones, weights and throat morphs) to look right.
tr: 只调整男性的嘴。关闭：任何带有 SMP Head 嘴部骨骼的头部都会被调整——需要为 DeepFit 制作的头部（嘴部骨骼、权重和喉咙变形）才能显示正常。

en: Presets
tr: 预设

en: Subtle
tr: 轻微

en: Default
tr: 默认

en: Extreme
tr: 夸张

en: Sets the throat, mouth-width, cheek, gulp and shape sliders together. Fine-tune them below afterwards.
tr: 一次设置喉咙、嘴宽、脸颊、吞咽和形状滑块。之后可在下方微调。

en: Test (no scene needed)
tr: 测试（无需场景）

en: Show a test schlong in my mouth
tr: 在我嘴里显示测试用阴茎

en: A made-up schlong goes into the player's mouth, so you can tune the mouth and throat here without starting a scene. Not saved - switch it off when done. Needs a head built for DeepFit on the player.
tr: 一根虚拟的阴茎会进入玩家的嘴里，这样无需开始场景就能在这里调整嘴和喉咙。不会保存——调完请关闭。玩家需要使用为 DeepFit 制作的头部。

en: Tip depth
tr: 顶端深度

en: Half its height
tr: 高度的一半

en: Half its width
tr: 宽度的一半

en: Shape:
tr: 形状：

en: Goes in and out
tr: 来回抽送

en: Mouth
tr: 嘴

en: Mega mouth
tr: 超大张嘴

en: As wide as the mouth morphs go, whatever the shaft. Off: the mouth opens to the shaft's own thickness where it passes the lips, and closes again round a slimmer part.
tr: 无论阴茎粗细，嘴都张到变形的最大。关闭：嘴按阴茎经过嘴唇处的粗细张开，遇到较细的部分会再合拢。

en: Mega mouth key: press the key now (Esc to cancel)
tr: 超大张嘴按键：现在按下按键（Esc 取消）

en: Mega mouth key:
tr: 超大张嘴按键：

en: Set key
tr: 设置按键

en: No key
tr: 无按键

en: Switches Mega mouth on and off in game. Press Set key, then the key - hold Shift, Ctrl and / or Alt with it for a combination (e.g. Alt+Shift+G). The key's switch is not saved; the key is.
tr: 在游戏中开关超大张嘴。点击“设置按键”，然后按下按键——同时按住 Shift、Ctrl 和/或 Alt 可设为组合键（如 Alt+Shift+G）。按键切换的状态不保存，按键本身会保存。

en: DeepFit opens the mouth
tr: 由 DeepFit 张开嘴

en: DeepFit drives the SMP Head mouth morphs (PPA_JawWide, PPA_LipStretch, PPA_LipWiden) and its own. Off: only the lip bones move, and the morphs are left to PPA or another mod.
tr: DeepFit 驱动 SMP Head 的嘴部变形（PPA_JawWide、PPA_LipStretch、PPA_LipWiden）以及它自己的变形。关闭：只移动嘴唇骨骼，变形交给 PPA 或其他模组。

en: Room round the shaft
tr: 阴茎周围的空隙

en: The mouth opens this much more than the shaft is thick.
tr: 嘴比阴茎的粗细多张开这么多。

en: Jaw (units per 100)
tr: 下巴（每 100 的单位）

en: How far the jaw morph at 100 opens the jaw. Lower = the jaw opens wider for the same shaft.
tr: 下巴变形为 100 时张开的距离。越低 = 同样的阴茎下巴张得越大。

en: Lips round (units per 100)
tr: 嘴唇撅圆（每 100 的单位）

en: Corners spread (units per 100)
tr: 嘴角张开（每 100 的单位）

en: Most a morph is set to
tr: 变形的最大值

en: MFEE caps the morphs too: its Max in MuFacialExpressionExtended.ini (100 as installed). Raise both for more than the morph's full size.
tr: MFEE 也会限制变形：MuFacialExpressionExtended.ini 中的 Max（安装时为 100）。想超过变形的完整大小，需要同时提高两者。

en: Lips
tr: 嘴唇

en: Stretch past the shaft
tr: 超出阴茎的拉伸

en: Close in round a slim shaft
tr: 围绕细阴茎收拢

en: Upper lip, at most
tr: 上唇最多

en: Upper lip down
tr: 上唇下压

en: While the mouth is full the upper lip is pulled down this far (its middle fully, the sides a little less) - the lip-round morph peaks it up towards the nose. Below 0 it is lifted instead (a cat's muzzle rising off the shaft).
tr: 嘴里塞满时上唇被向下拉这么远（中间完全，两侧稍少）——撅唇变形会把它向鼻子顶起。低于 0 时改为上抬（像猫的口鼻离开阴茎那样抬起）。

en: Lower lip, at most
tr: 下唇最多

en: Corners, at most
tr: 嘴角最多

en: Mouth opens to the sides
tr: 嘴向两侧张开

en: The corners of his mouth pull out to the sides to the schlong's width (DeepFit's DF_MouthWide morph), so the mouth opens wide round it instead of puckering.
tr: 他的嘴角按阴茎的宽度向两侧拉开（DeepFit 的 DF_MouthWide 变形），让嘴围着它大张，而不是撅成圆形。

en: Corners out, at most
tr: 嘴角外张最多

en: Corners out with the jaw
tr: 嘴角随下巴外张

en: Lips round forward
tr: 嘴唇向前撅

en: How much the lips push forward into an O. Lower = less of a pucker, more of a wide-open mouth (1 = as before 0.3.8).
tr: 嘴唇向前撅成 O 形的程度。越低 = 越少撅嘴、越像大张的嘴（1 = 与 0.3.8 之前相同）。

en: Cheek bulge
tr: 脸颊鼓起

en: A shaft pushed to one side of his mouth bulges that cheek out (SMP Head's cheek bones). 0 = off.
tr: 阴茎顶向嘴的一侧时，那一侧的脸颊会鼓起（SMP Head 的脸颊骨骼）。0 = 关闭。

en: Cheek, at most
tr: 脸颊最多

en: Room before the cheek
tr: 脸颊前的空隙

en: Throat and teeth
tr: 喉咙和牙齿

en: Throat bulge, by the schlong's shape
tr: 喉咙鼓起，按阴茎的形状

en: DeepFit's own throat morphs: ten thin bands down the front of his throat, from under his chin to just above the neck seam. Where the shaft is, the throat fills out to a straight line from chin to neck, then swells past it by how thick that part of the schlong is, so a flared head, a medial ring or a knot shows as it goes down.
tr: DeepFit 自己的喉咙变形：沿他喉咙前侧的十条窄带，从下巴下方到颈部接缝上方。阴茎所在处，喉咙先鼓到从下巴到脖子的直线，再按阴茎那一段的粗细继续鼓起，所以张开的龟头、中环或结会随着深入显现出来。

en: Throat starts at
tr: 喉咙开始于

en: How far past his lips the schlong has to be to reach the top of his throat (under his chin).
tr: 阴茎要越过嘴唇多远才能到达喉咙顶部（下巴下方）。

en: Shaft per band
tr: 每条带对应的阴茎长度

en: How much of the shaft's length each of the ten bands stands for (smaller = the throat shows a shorter stretch of it, in more detail).
tr: 十条带中每条代表阴茎的多少长度（越小 = 喉咙显示的阴茎越短、细节越多）。

en: Fill out to the line
tr: 鼓到直线

en: Room in an empty throat
tr: 空喉咙的空隙

en: A schlong thinner than this (half its thickness, in units) passes without a bulge.
tr: 比这更细的阴茎（粗细的一半，单位）通过时不会鼓起。

en: Bulge per thickness
tr: 每单位粗细的鼓起

en: Shape stands out
tr: 形状突出

en: A flared head, medial ring or knot this many times more pronounced than the shaft itself (1 = exactly as the schlong is shaped).
tr: 张开的龟头、中环或结比阴茎本身明显这么多倍（1 = 完全按阴茎的形状）。

en: Bulge, at most
tr: 鼓起最多

en: Wider
tr: 更宽

en: Every bulge spreads further across his neck as soft shoulders round the shaft's own ridge (0 = as wide as the shaft, 1 = most of the front of his neck).
tr: 每个鼓起都以柔和的肩部围绕阴茎本身的隆起，在他脖子上铺得更宽（0 = 与阴茎同宽，1 = 脖子前侧的大部分）。

en: Moves with each stroke
tr: 随每次抽送移动

en: A soft ripple that slides along his throat as the shaft goes in and out, so it still moves when his throat is as full as it gets.
tr: 阴茎进出时，一道柔和的波纹沿他的喉咙滑动，所以即使喉咙已经塞满也仍在动。

en: Ripple length
tr: 波纹长度

en: Spreads fully sideways at
tr: 完全向两侧铺开于

en: A schlong wider than it is tall spreads the bulge out to the sides; this much wider (half width over half height) spreads it all the way.
tr: 宽度大于高度的阴茎会让鼓起向两侧铺开；宽出这么多（半宽减半高）时完全铺开。

en: Measure along the shaft
tr: 沿阴茎测量

en: Measures the shaft along its own line, so one that goes in at an angle or bends reads its real thickness. Off: sliced straight back from his lips.
tr: 沿阴茎自身的走向测量，所以斜着进入或弯曲的阴茎也能读出真实粗细。关闭：从嘴唇笔直向后切片测量。

en: Ridged schlong's ridge
tr: 带棱阴茎的棱

en: Segmented schlong's knobs
tr: 分节阴茎的结节

en: Anatomica tells DeepFit when the schlong is ridged or segmented (the same shape its belly bulge uses); its ridge or knobs then show down his throat.
tr: Anatomica 会告诉 DeepFit 阴茎是否带棱或分节（与腹部鼓起使用的形状相同）；它的棱或结节就会显现在他的喉咙上。

en: Swallow
tr: 吞咽

en: Each of Anatomica's gulps (when he swallows a finish) runs down his throat as a ripple. 0 = off.
tr: Anatomica 的每次吞咽（他咽下射出的精液时）都会以波纹的形式沿喉咙向下滑。0 = 关闭。

en: Swallow time
tr: 吞咽时间

en: Gag: jaw drops
tr: 作呕：下巴下沉

en: When Anatomica makes him gag, his jaw drops a little further and his throat tightens for a moment.
tr: Anatomica 让他作呕时，他的下巴会再张开一点，喉咙会短暂收紧。

en: Gag: throat tightens
tr: 作呕：喉咙收紧

en: Teeth part while the mouth is full
tr: 嘴里塞满时牙齿分开

en: Other mods
tr: 其他模组

en: Other mods can switch Mega mouth with a mod event: SendModEvent("DeepFit_MegaMouth", "", 1.0) on, 0.0 off, -1.0 back to the setting here. "DeepFit_Mouth" the same for DeepFit opening the mouth at all.
tr: 其他模组可以用模组事件切换超大张嘴：SendModEvent("DeepFit_MegaMouth", "", 1.0) 开启，0.0 关闭，-1.0 恢复为这里的设置。"DeepFit_Mouth" 同理，控制 DeepFit 是否张开嘴。

en: Debug log
tr: 调试日志

en: Reset to defaults
tr: 恢复默认

en: Every setting on this page back to as installed (your Mega mouth key and the debug log stay). Each slider's default sits in the middle of its range.
tr: 本页所有设置恢复为安装时的值（超大张嘴按键和调试日志保留）。每个滑块的默认值位于其范围的中间。

en: %.1f units past the lips
tr: 越过嘴唇 %.1f 单位

en: x%.2f
tr: x%.2f

en: %.1f units
tr: %.1f 单位

en: x%.1f
tr: x%.1f

en: %.1f units deep
tr: 深 %.1f 单位

en: %.2f units
tr: %.2f 单位

en: %.1f units wider
tr: 宽出 %.1f 单位

en: %.1f s
tr: %.1f 秒

en: Plain
tr: 普通

en: Horse (flare and medial ring)
tr: 马（张开的龟头和中环）

en: Knot
tr: 结

en: Ridged
tr: 带棱

en: Segmented
tr: 分节

en: Guess unknown skeletons
tr: 猜测未知骨架

en: A partner whose skeleton DeepFit does not know: his schlong bones are found from their names (Penis, Dick, Cock, Genital, Shaft, Knot, or the short "XD 2" style many rigs use).
tr: 对于 DeepFit 不认识骨架的伴侣：根据骨骼名称找出其阴茎骨骼（Penis、Dick、Cock、Genital、Shaft、Knot，或许多骨架使用的简短 "XD 2" 形式）。

en: Anything at his lips counts
tr: 唇边的任何部分都算

en: Last resort for a partner where nothing is found at all: any part of his mesh that reaches the lips opens the mouth and fills the throat. Heavier, and his body near the face can be read too - leave it off unless you need it.
tr: 完全找不到任何部位时的最后手段：他的网格中任何碰到嘴唇的部分都会张开嘴并填充喉咙。开销更大，且靠近脸部的身体部位也可能被读取——除非需要，请保持关闭。

en: What DeepFit found
tr: DeepFit 的识别结果

en: Nothing yet - it shows here once a shaft is in a fitted mouth.
tr: 暂无——当阴茎进入已适配的嘴中时会显示在这里。

en: (%.0f s ago)
tr: （%.0f 秒前）

en: How the last partner was read: a skeleton DeepFit knows, bones it guessed from their names (listed), or anything at his lips; and whether the shaft came from his mesh or was built round his bones. If a guessed one looks wrong, this is why.
tr: 上一个伴侣是如何被识别的：DeepFit 认识的骨架、根据名称猜测的骨骼（已列出），或唇边的任何部分；以及阴茎是读取自他的网格还是围绕骨骼构建的。如果猜测结果看起来不对，原因就在这里。

en: Strength for
tr: 强度：

en: Scales how wide the mouth opens and how much the throat bulges for every partner of this race (1 = as the sliders below say). Saved per race in DeepFit.ini (RaceStrength).
tr: 按此种族的所有伴侣缩放嘴张开的宽度和喉咙鼓起的程度（1 = 按下方滑块）。按种族保存在 DeepFit.ini（RaceStrength）中。

en: Races set:
tr: 已设置的种族：

en: Clear races
tr: 清除种族

en: Lips drag with the stroke
tr: 嘴唇随抽动拖动

en: His lips roll out a little as the shaft pulls back and tuck in as it pushes in. 0 = off.
tr: 阴茎后退时他的嘴唇略微外翻，推入时内收。0 = 关闭。

en: Stroke speed for full drag
tr: 完全拖动所需的抽动速度

en: Face
tr: 面部

en: His face reacts
tr: 面部反应

en: His eyes close and his brows lift the deeper it goes; in a gag his eyes clench and his brows knit. Goes over OStim's own expression, never below it.
tr: 越深他的眼睛越闭、眉毛越抬；作呕时眼睛紧闭、眉头紧皱。叠加在 OStim 自身表情之上，不会低于它。

en: Eyes close with depth
tr: 随深度闭眼

en: Brows lift with depth
tr: 随深度抬眉

en: Clench in a gag
tr: 作呕时紧闭

en: After he pulls out
tr: 拔出之后

en: Mouth stays open for
tr: 嘴保持张开

en: After the shaft leaves his mouth it stays a little open for a moment before it closes. 0 = closes straight away.
tr: 阴茎离开嘴后，嘴会微张片刻再合上。0 = 立即合上。

en: How open it stays
tr: 保持张开的程度

en: Then he swallows
tr: 然后吞咽

en: Gags and swallows by themselves
tr: 自动作呕和吞咽

en: DeepFit makes him gag on a fast, deep thrust and swallow when it is held deep. When Anatomica sends its own gags and gulps, those are used instead.
tr: 快速深入时 DeepFit 会让他作呕，深处停留时会让他吞咽。当 Anatomica 发送自己的作呕和吞咽时，改用 Anatomica 的。

en: Deep is past the throat's top by
tr: 超过喉咙顶部多少算深

en: Gag at a thrust of
tr: 作呕的抽动速度

en: Time between gags
tr: 作呕间隔

en: Swallow when held deep for
tr: 深处停留多久后吞咽

en: Move the teeth:
tr: 移动牙齿：

en: Moves his teeth a little down and back so they sit clear of the shaft. They are hung on a node of DeepFit's own under his head, so the game rebuilding his face does not undo it for long - DeepFit checks once a second and puts them back. Always: kept moved outside scenes too, only on the men DeepFit fits, and only when this is chosen (it costs next to nothing).
tr: 将他的牙齿略微向下、向后移动，避开阴茎。牙齿挂在 DeepFit 自己位于头部下的节点上，因此游戏重建面部也不会让它长时间失效——DeepFit 每秒检查一次并重新挂上。始终：场景外也保持移动，仅限 DeepFit 适配的男性，且仅在选择此项时生效（几乎没有开销）。

en: Teeth down
tr: 牙齿向下

en: Teeth back
tr: 牙齿向后

en: Off
tr: 关闭

en: While the mouth is full
tr: 嘴里有东西时

en: Always (kept moved)
tr: 始终（保持移动）

en: %.0f units/s
tr: %.0f 单位/秒

en: Show it
tr: 显示

en: A plain schlong is shown in his mouth where the test one is (only its thickness and depth - the shapes below are felt by the mouth and throat, not drawn).
tr: 在测试阴茎的位置于他嘴中显示一根普通阴茎（只体现粗细和深度——下方的形状只影响嘴和喉咙，不会画出来）。

en: Size:
tr: 尺寸：

en: Sliders
tr: 滑块

en: Mine (TNG)
tr: 我的（TNG）

en: A plain schlong the size of one of TNG's size categories (scaled as set in TNG's MCM), or of the player's own TNG size. Sliders: the height, width and shape below.
tr: 一根普通阴茎，大小取自 TNG 的某个尺寸档（按 TNG MCM 中的设置缩放），或玩家自己的 TNG 尺寸。滑块：使用下方的高度、宽度和形状。

en: Your TNG size: %s (x%.2f)%s
tr: 你的 TNG 尺寸：%s（x%.2f）%s

en:  - TNG did not answer, M used
tr:  ——TNG 未响应，使用 M

en: Lower lip up
tr: 下唇上推

en: While the mouth is full the lower lip is pushed up this far (its middle fully, the sides a little less), closer round the shaft.
tr: 嘴里有东西时，下唇向上推这么远（中间全额，两侧略少），更贴合阴茎。

en: Open to the shaft's real thickness
tr: 按阴茎实际粗细张嘴

en: The mouth opens to the shaft measured straight across it. Off: measured straight up and down his face, so a shaft going in at an angle opens it wider (as before 0.4.1).
tr: 嘴按垂直于阴茎方向测得的粗细张开。关闭：沿脸部上下方向测量，斜着进入的阴茎会让嘴张得更大（0.4.1 之前的做法）。

en: Bump
tr: 凸起

en: Bump along it
tr: 凸起位置

en: %.2f (0 base, 1 tip)
tr: %.2f（0 根部，1 尖端）

en: Bump size
tr: 凸起大小

en: x%.2f thicker
tr: 粗 x%.2f

en: Stroke speed
tr: 抽动速度

en: %.2f a second
tr: 每秒 %.2f 次

en: Stroke length
tr: 抽动长度

en: %.2f of the depth
tr: 深度的 %.2f

en: Enters higher
tr: 进入点上移

en: Enters to his right
tr: 进入点右移

en: Tip up
tr: 尖端向上

en: Tip to his right
tr: 尖端向右

en: Places and angles the test schlong in his mouth (negative = lower / to his left / tip down). The lips, cheeks and throat fit it where it is, the same as a real one.
tr: 调整测试阴茎在嘴中的位置和角度（负值 = 更低 / 向他左边 / 尖端向下）。嘴唇、脸颊和喉咙会像对真实阴茎一样贴合它。

en: Centre it
tr: 居中

en: %.0f degrees
tr: %.0f 度

en: Tilt my head back
tr: 头向后仰

en: Tilts the player's head back (chin up) while testing, so the throat bulge is easier to see.
tr: 测试时让玩家的头向后仰（抬下巴），更容易看到喉咙鼓起。

en: MFEE's limit (its ini): %.0f
tr: MFEE 的上限（其 ini）：%.0f

en: Raise MFEE's limit to 300
tr: 将 MFEE 上限提高到 300

en: Put MFEE's limit back to 100
tr: 将 MFEE 上限改回 100

en: MFEE's limit is changed in its ini - restart the game for it to take effect (MFEE only reads it at start).
tr: MFEE 的上限已在其 ini 中修改——需要重启游戏才能生效（MFEE 只在启动时读取）。

en: MFEE has no way to change its limit while the game runs: the button writes it to MFEE's ini, and it takes effect after a restart. It is MFEE's limit for every morph it drives, not only DeepFit's.
tr: MFEE 无法在游戏运行时更改上限：此按钮会写入 MFEE 的 ini，重启后生效。这是 MFEE 对其驱动的所有变形的上限，不只是 DeepFit 的。

en: A plain schlong the size of one of TNG's size categories, or of the player's own TNG size. Each size uses your TNG size modifier for it - the multiplier set for that size in TNG's MCM (0.8 / 0.9 / 1.0 / 1.2 / 1.4 as TNG installs them); TNG's per-race multipliers are not included. Sliders: the height, width and shape below.
tr: 一根普通阴茎，大小取自 TNG 的某个尺寸档，或玩家自己的 TNG 尺寸。每个尺寸使用你的 TNG 尺寸修正值——即 TNG MCM 中该尺寸的倍数（TNG 默认 0.8 / 0.9 / 1.0 / 1.2 / 1.4）；不包括 TNG 的按种族倍数。滑块：使用下方的高度、宽度和形状。

en: Sizes follow your TNG size modifiers (TNG's MCM).
tr: 尺寸遵循你的 TNG 尺寸修正值（TNG 的 MCM）。

en: The whole scene
tr: 整个场景

en: Moves his teeth a little down and back so they sit clear of the shaft, only in scenes: while his mouth is full, or the whole time a partner's schlong is near him. Outside scenes they are put back exactly where the game has them. If the game rebuilds his face mid-scene, DeepFit moves them again within a second.
tr: 仅在场景中将他的牙齿略微向下、向后移动，避开阴茎：嘴里有东西时，或伴侣的阴茎在他附近的整个期间。场景外牙齿会精确回到游戏原本的位置。如果游戏在场景中重建了他的面部，DeepFit 会在一秒内再次移动牙齿。

en: Sets the mouth, lips, cheeks, throat, swallow / gag, face and lip-drag sliders together - Default is the tuned set, Subtle softer, Extreme stronger. Fine-tune them below afterwards. Teeth placement and what DeepFit reads are left as they are.
tr: 一次性设置嘴、嘴唇、脸颊、喉咙、吞咽/作呕、面部和嘴唇拖动滑块——默认为调好的一组，轻微更柔和，极端更强烈。之后可在下方微调。牙齿位置和 DeepFit 的读取方式保持不变。

en: Follow PPA's aim into his mouth
tr: 跟随 PPA 对准嘴部

en: PPA bends the partner's schlong into his mouth after DeepFit has read where the animation put it. When an animation leaves it a few units off (under his chin), the mouth stayed shut although on screen it was in. On: a shaft whose line passes close by his lips is turned onto them, the way PPA aims it.
tr: PPA 会在 DeepFit 读取动画位置之后才把伴侣的阴茎弯进他嘴里。当动画让它偏离几个单位（在下巴下方）时，即使画面上已经进嘴，嘴也不会张开。开启：轴线从嘴唇附近经过的阴茎会像 PPA 那样被转向嘴唇。

en: Aim when it passes within
tr: 在以下距离内时对准

en: %.1f units of his lips
tr: 距嘴唇 %.1f 单位

en: Turn it at most
tr: 最多转动

en: Built in:
tr: 内置：

en: Your presets:
tr: 你的预设：

en: none yet
tr: 暂无

en: Refresh
tr: 刷新

en: Name
tr: 名称

en: Save as preset
tr: 另存为预设

en: Saves every per-head setting (mouth, lips, face, throat, sounds) as a preset file in Data\SKSE\Plugins\DeepFit\Presets\Male (or Female). Share the file with a head you built for DeepFit (a UBE or 3BA head, say) - others put it in the same folder and load it here.
tr: 将每个头部相关设置（嘴、嘴唇、面部、喉咙、声音）保存为预设文件，位于 Data\SKSE\Plugins\DeepFit\Presets\Male（或 Female）。可与你为 DeepFit 制作的头部（例如 UBE 或 3BA 头部）一起分享——其他人放进同一文件夹即可在此加载。

en: Women's heads (built for DeepFit)
tr: 女性头部（为 DeepFit 制作）

en: Women's heads are off - switch on "Women's heads too" on the Info page to use these.
tr: 女性头部已关闭——在信息页开启“也适配女性头部”后才会使用这些设置。

en: Used for women whose head is built for DeepFit; saved to DeepFit_Female.ini.
tr: 用于头部为 DeepFit 制作的女性；保存到 DeepFit_Female.ini。

en: Lips round the shaft
tr: 嘴唇包裹

en: Corners
tr: 嘴角

en: With each stroke
tr: 每次抽动

en: Opening
tr: 张开

en: Cheeks
tr: 脸颊

en: Teeth
tr: 牙齿

en: Where
tr: 位置

en: How much
tr: 程度

en: Swallow and gag
tr: 吞咽与作呕

en: (%d files)
tr: （%d 个文件）

en: Gag
tr: 作呕

en: Breath after he pulls out
tr: 拔出后的喘息

en: Only DeepFit's own swallows and gags
tr: 仅 DeepFit 自己的吞咽和作呕

en: Anatomica plays its own gulp sounds when it makes him swallow. On: DeepFit only sounds the swallows and gags it makes itself (held deep, a fast deep thrust, after he pulls out). Off: every one, Anatomica's too.
tr: Anatomica 让他吞咽时会播放自己的吞咽声。开启：DeepFit 只为自己触发的吞咽和作呕发声（深处停留、快速深入、拔出之后）。关闭：所有的都发声，包括 Anatomica 的。

en: Sound files: WAV or XWM in Data\Sound\Fx\DeepFit\gulp, \gag and \gasp - any number, one picked at random each time. With none for swallows, Anatomica's gulp sounds are used. 0 volume = off.
tr: 声音文件：WAV 或 XWM，放在 Data\Sound\Fx\DeepFit\gulp、\gag 和 \gasp——数量不限，每次随机选一个。若没有吞咽声音文件，则使用 Anatomica 的吞咽声。音量 0 = 关闭。

en: Look for sound files again
tr: 重新查找声音文件

en: Women's heads too
tr: 也适配女性头部

en: Also fits women whose head is built for DeepFit (its mouth bones, weights and throat morphs), with their own settings - the "Women's heads" drop-down at the bottom of each page, saved to DeepFit_Female.ini. Off: only men's mouths.
tr: 也适配头部为 DeepFit 制作的女性（需要其嘴部骨骼、权重和喉咙变形），使用她们自己的设置——每页底部的“女性头部”下拉栏，保存到 DeepFit_Female.ini。关闭：只适配男性的嘴。

en: Men's heads
tr: 男性头部

en: Women's heads
tr: 女性头部

en: Reset women's heads to defaults
tr: 将女性头部重置为默认

en: %.2f volume
tr: 音量 %.2f

en: Extra push
tr: 额外深入

en: Now and then it goes deeper
tr: 不时更深

en: At the deepest point of a stroke, now and then, the bulge goes further down his throat for a moment - as if pushed in harder - then eases back to where the shaft really is. It reaches at most the bottom of his throat (the neck seam).
tr: 在抽动最深处，鼓起会不时沿喉咙再往下走一段——像被更用力推入——然后缓缓回到阴茎实际所在的位置。最多到喉咙底部（颈部接缝）。

en: How much deeper
tr: 再深多少

en: Chance each stroke
tr: 每次抽动的几率

en: 0.25 = about one stroke in four; 1 = every stroke.
tr: 0.25 = 大约每四次一次；1 = 每次都有。

en: Stays there for
tr: 停留时间

en: Flared head
tr: 外翻龟头

en: A flared (horse) schlong's head swells this much more just behind the tip, even when his mesh does not read as flared.
tr: 外翻（马）阴茎的龟头在尖端后方额外鼓起这么多，即使其网格读不出外翻。

en: A knot all the way in opens the mouth
tr: 结完全进入时嘴张开更多

en: The schlong's shape (ridged, segmented, flared, knotted) comes from Anatomica when it is installed (the same shape its belly bulge uses), otherwise DeepFit finds it itself - see Info, "Schlong shapes".
tr: 阴茎的形状（棱纹、分节、外翻、带结）在安装了 Anatomica 时由它提供（与其腹部鼓起使用的形状相同），否则由 DeepFit 自己识别——见信息页“阴茎形状”。

en: Schlong shapes
tr: 阴茎形状

en: Anatomica is installed: it tells DeepFit each schlong's shape (its compatibility files, menu choices and More Nasty Critters), so DeepFit's own detection stays off and the two never disagree.
tr: 已安装 Anatomica：它会告诉 DeepFit 每根阴茎的形状（其兼容文件、菜单选择和 More Nasty Critters），因此 DeepFit 自己的识别保持关闭，两者不会冲突。

en: Find each schlong's shape
tr: 识别每根阴茎的形状

en: Without Anatomica, DeepFit finds the partner's schlong shape itself: a keyword on the schlong (DeepFit_Shape_Flared / _Knotted / _Ridged / _Segmented / _Tentacle / _Plain, or Anatomica's Anatomica_Shape_ ones), its name (horse, canine, knot, argonian, ...), then his race. What it found shows under "What DeepFit found".
tr: 没有 Anatomica 时，DeepFit 自己识别伴侣阴茎的形状：阴茎上的关键字（DeepFit_Shape_Flared / _Knotted / _Ridged / _Segmented / _Tentacle / _Plain，或 Anatomica 的 Anatomica_Shape_ 关键字）、其名称（horse、canine、knot、argonian……），然后是他的种族。识别结果显示在“DeepFit 的识别结果”下。

en: Round the lower lip
tr: 下唇变圆

en: As the jaw opens, the sides of the lower lip (between its middle and the corners) push out and down, so the opening is round instead of a diamond pinched in at the sides of the lower lip. 0 = off. Needs the 0.4.4 head morphs (DF_LowerLipRound).
tr: 张嘴时，下唇两侧（中间与嘴角之间）向外、向下推，使开口呈圆形，而不是两侧内收的菱形。0 = 关闭。需要 0.4.4 的头部变形（DF_LowerLipRound）。

en: 3 units is as far as the head's throat morphs go (MFEE's limit of 100) - past that every bulge would look the same.
tr: 3 单位是头部喉咙变形的上限（MFEE 的 100 上限）——超过后每个鼓起看起来都一样。

en: Throat back to recommended
tr: 喉咙恢复推荐值

en: Where and how much: the throat starts 6.1 units past the lips and shows 18.6 units of the shaft, so a flared head, a ring or a knot each lands on its own part of his throat. Very short bands, a low "Bulge, at most" or "Shape stands out" at 1 make every schlong look the same.
tr: 位置与程度：喉咙从嘴唇后 6.1 单位开始，显示 18.6 单位长的阴茎，使外翻龟头、环或结各自落在喉咙的不同位置。很短的分段、较低的“鼓起上限”或“形状突出”为 1，会让每根阴茎看起来都一样。

en: His throat shows the shaft from %.1f to %.1f units past his lips.
tr: 他的喉咙显示嘴唇后 %.1f 到 %.1f 单位的阴茎。

en: Throat swells meanwhile
tr: 同时喉咙膨胀

en: While pushed deeper, the throat also swells this much more. Going deeper only shows while the shaft does not already reach the bottom of his throat ("His throat shows the shaft from ... to ..." on this page); the swell shows at any depth.
tr: 更深时，喉咙也会额外膨胀这么多。“更深”只有在阴茎尚未到达喉咙底部时才看得出（见本页“他的喉咙显示……到……”）；膨胀在任何深度都看得出。

en:  (women)
tr:  （女性）

en:  (men and women)
tr:  （男性和女性）

en: Used for:
tr: 用于：

en: (nothing set - add Races or HeadMeshes to its file)
tr: （未设置——在其文件中添加 Races 或 HeadMeshes）

en: Saved to
tr: 保存到

en: Heads
tr: 头部

en: No head profiles - every head uses DeepFit's own bones and the settings above.
tr: 没有头部配置——所有头部都使用 DeepFit 自带的骨骼和上面的设置。

en: bones set
tr: 根骨骼已设置

en: Reload head files
tr: 重新读取头部文件

en: Each head DeepFit fits can have a profile: a file in Data\SKSE\Plugins\DeepFit\Heads. It names the races (or head meshes) it is for, the head's bones and which way each pushes, and keeps that head's own settings (the drop-downs at the bottom of each page). To add a head, copy one of the files, change it and press Reload - nothing needs compiling. Heads without a profile use the settings above.
tr: DeepFit 适配的每种头部都可以有一个配置：Data\SKSE\Plugins\DeepFit\Heads 中的一个文件。它写明适用的种族（或头部模型）、头部的骨骼及每根骨骼的推动方向，并保存该头部自己的设置（每页底部的下拉菜单）。要添加头部，复制其中一个文件，修改后按“重新读取”——无需编译。没有配置的头部使用上面的设置。

en: Upper lip closes onto the shaft
tr: 上唇贴合阴茎

en: On a shallow stroke the thinner front of the shaft rides low in his mouth and the upper lip has further to come down. Its bones are only half weighted in the head, so they need to move about twice as far as the lip should: raise this if the upper lip floats above the shaft (2 = about right for SMP Head). Needs "Close in round a slim shaft" above 0.
tr: 浅插时阴茎较细的前段位于他嘴里较低的位置，上唇需要下移更多。头部中上唇骨骼的权重只有一半左右，所以骨骼需要移动约两倍距离：如果上唇浮在阴茎上方，就调高此项（SMP Head 约为 2）。需要“围绕细阴茎收拢”大于 0。

en: Read his schlong where PPA aims it
tr: 按 PPA 瞄准的位置读取阴茎

en: PPA bends his schlong into the mouth after the animation, later in the frame than DeepFit runs. On: DeepFit reads it as the last frame ended (where PPA put it, as you see it). Off: as the animation has it (before PPA's aim) - a scene where it is clearly in his mouth but the mouth does not open needs this on.
tr: PPA 在动画之后、比 DeepFit 更晚的时机把阴茎弯进嘴里。开启：DeepFit 按上一帧结束时的位置读取（即 PPA 放置的、你看到的位置）。关闭：按动画的位置读取（PPA 瞄准之前）——如果阴茎明明在嘴里但嘴不张开，就需要开启此项。

en: Keep it in the middle of the open mouth
tr: 保持在张开的嘴中间

en: The jaw opens downward, so the middle of his lips at rest ends up high in the open mouth: this lowers the test schlong by half of how far the jaw has dropped, keeping it in the middle of the opening. "Enters higher" moves it from there.
tr: 下颌向下张开，所以静止时双唇的中点在张开的嘴里偏高：此项把测试阴茎降低下颌下降距离的一半，使其保持在开口中间。“进入点上移”在此基础上调整。

en: Men's heads (human)
tr: 男性头部（人类）

en: Every man's head without a head profile below; saved to DeepFit.ini.
tr: 所有没有下方头部配置的男性头部；保存到 DeepFit.ini。

en: Hide his teeth during a scene
tr: 场景中隐藏牙齿

en: His teeth and tongue (the parts named in TeethParts) are hidden while he is in a scene and shown again after. Beast heads have it on: their jaw drops further than their teeth go with it.
tr: 场景中隐藏他的牙齿和舌头（TeethParts 中列出的部件），结束后恢复显示。兽族头部默认开启：它们的下颌下降得比牙齿跟随的更多。

en: Refresh my head
tr: 刷新我的头部

en: After changing race or head (RaceMenu): DeepFit lets go of your old head and finds your new one's bones, head profile and teeth again at once - no scene needed.
tr: 更换种族或头部（RaceMenu）后：DeepFit 立即放开旧头部，重新查找新头部的骨骼、头部配置和牙齿——无需进入场景。

en: Upper jaw down (snouts)
tr: 上颌下压（吻部）

en: A beast's whole upper snout tilts down onto the shaft as the jaw opens (1 = 10 degrees, about 1.8 units at the tip of an Argonian's). Only heads that have DeepFit's DF_UpperJawDown morph (the Argonian High Poly Head) - others ignore it.
tr: 下颌张开时，兽族的整个上吻部向下倾压到阴茎上（1 = 10 度，亚龙人吻尖约 1.8 单位）。仅对带有 DeepFit 的 DF_UpperJawDown 变形的头部有效（亚龙人高面数头部）——其他头部忽略。

en: Lower lip closes onto the shaft
tr: 下唇贴合阴茎

en: When the jaw opens further than the shaft needs (a thick knot, or a low "Jaw (units per 100)"), the lower lip comes back up onto the shaft. Raise this if a gap stays under the shaft. Needs "Close in round a slim shaft" above 0.
tr: 当下颌张开得比阴茎所需更大时（粗大的结，或较低的“下巴（每 100 的单位）”），下唇会回升贴合阴茎。如果阴茎下方留有缝隙，就调高此项。需要“围绕细阴茎收拢”大于 0。

en: Smooth the lips
tr: 平滑嘴唇

en: Each lip's bones are evened out against the ones next to them, so no single bone pokes out further than its neighbours (a spike at the side of a snout). Heads with only three bones per lip (people's) are left alone.
tr: 每片嘴唇的骨骼会与相邻骨骼平均，使任何一根骨骼都不会比旁边的突出更多（吻部两侧的尖刺）。每片嘴唇只有三根骨骼的头部（人类）不受影响。

en: Corners close onto the shaft
tr: 嘴角贴合阴茎

en: The corners of his mouth come in onto the sides of the shaft this many times harder. Raise it if the sides of the mouth stay open beside the shaft (the Khajiit's corner bones only carry a little of the lips, about 2.5 makes up for it). Needs "Close in round a slim shaft" above 0.
tr: 嘴角向阴茎两侧收拢的力度倍数。如果阴茎旁边的嘴两侧仍然张开，就调高此项（虎人的嘴角骨骼只带动一小部分嘴唇，约 2.5 可以弥补）。需要“围绕细阴茎收拢”大于 0。

en: Pull-out hold
tr: 抽出缓合

en: %.2f s
tr: %.2f 秒

en: As he pulls back, only the thin tip of his schlong is between the lips for a moment: the mouth snapped shut onto it and open again (jerky). With this, the lips and jaw close no faster than this many seconds for the whole way - they still open at once round a thicker part. 0 = off; about 0.4-0.8 for a snout.
tr: 他向后抽出时，嘴唇之间短暂只剩阴茎细细的尖端：嘴会猛地合上再张开（抖动）。开启后，嘴唇和下颌完全合拢至少需要这么多秒——遇到更粗的部分仍会立即张开。0 = 关闭；吻部约 0.4-0.8。

en: Lips follow speed
tr: 嘴唇跟随速度

en: How fast the lips and jaw bones catch up with the shaft (per second). Lower is smoother on a shaft that is thicker in some places than others (a snout's lips jerked from one size to the next); higher sticks closer. Each head keeps its own.
tr: 嘴唇和下颌骨骼追上阴茎的速度（每秒）。阴茎粗细不均时，调低会更平滑（吻部嘴唇会在不同粗细之间跳动）；调高则贴合更紧。每种头部各自保存。

en: Note: only a beard the game animates - one that moves when he talks or makes faces - can follow the mouth. A static beard (one that never moves with his expressions) is a fixed mesh DeepFit cannot bend: it is listed below as static and stays as it is. "Shave my beard for the scene" hides it instead. A beard DeepFit has not seen before follows the mouth from the next game start (MFEE moves it, and reads its list when the game starts).
tr: 注意：只有游戏会做动画的胡子（说话或做表情时会动的胡子）才能跟随嘴部。静态胡子（从不随表情移动的胡子）是固定网格，DeepFit 无法使其弯曲：它会在下方显示为静态并保持原样。“场景中剃掉我的胡子”可以改为将其隐藏。DeepFit 之前没见过的胡子会从下次启动游戏起跟随嘴部（由 MFEE 移动，它在游戏启动时读取列表）。

en: Shave my beard for the scene
tr: 场景中剃掉我的胡子

en: Your beard and moustache are hidden while a shaft is at your mouth in a scene, and come back after. Nothing is changed on your character (RaceMenu) - only hidden for the scene.
tr: 场景中阴茎在你嘴边时，你的胡子和小胡子会被隐藏，之后恢复。你的角色（RaceMenu）不会被更改——只是在场景中隐藏。

en: Beards follow the mouth
tr: 胡子跟随嘴部

en: A beard moves with the face under it: the moustache with the upper lip, the chin beard down with the jaw and lower lip, the sides with the corners - as far as DeepFit moves that part of the face (its morphs and lip bones). The beard's own expressions and lip sync play as before.
tr: 胡子随其下方的脸部移动：小胡子随上唇，下巴胡子随下颌和下唇下移，两侧随嘴角——移动幅度与 DeepFit 移动该部位脸部的幅度相同（其变形和嘴唇骨骼）。胡子自身的表情和口型照常播放。

en: How much they follow
tr: 跟随程度

en: 1 = exactly as the face under it moves. Lower if a beard looks stretched, higher if it lags behind the lips. Takes effect from the next game start.
tr: 1 = 与其下方的脸部完全一致。如果胡子看起来被拉伸就调低，如果跟不上嘴唇就调高。从下次启动游戏起生效。

en: Follow within
tr: 跟随范围

en: %.1f units of the face
tr: 距脸部 %.1f 单位内

en: Beard this close to the face follows it fully; further out it follows less, and not at all past twice this. Raise it for long beards that should swing down with the jaw, lower it if hair far from the mouth moves. Takes effect from the next game start.
tr: 距离脸部这么近的胡子完全跟随；更远的跟随较少，超过两倍距离则完全不跟随。长胡子需要随下颌摆动时调高，离嘴较远的毛发也在动时调低。从下次启动游戏起生效。

en: Your beard
tr: 你的胡子

en: What DeepFit found on your character: each facial hair part, and whether it follows the mouth now, will from the next game start, or cannot (static). Updated every few seconds.
tr: DeepFit 在你的角色上找到的内容：每个面部毛发部件，以及它现在是否跟随嘴部、从下次启动游戏起跟随，还是无法跟随（静态）。每隔几秒更新。

en: Lower lip follows the shaft in
tr: 下唇向内跟随阴茎

en: The lower lip also feels the shaft this far further into the mouth. A shaft sloping down into the mouth then draws the front of the lower lip down to meet it, instead of the lip staying level with where the shaft crosses the lips. 0 = only at the lips.
tr: 下唇还会感知嘴里更深这么远处的阴茎。向下倾斜进入嘴里的阴茎会把下唇前部向下拉去贴合它，而不是让嘴唇停留在阴茎穿过嘴唇处的高度。0 = 只在嘴唇处。

en: Lower jaw drops with the lip
tr: 下颌随嘴唇下降

en: Lower jaw drops at most
tr: 下颌最多下降

en: Heads with a "Lower Jaw" bone (the Argonian High Poly Head): the whole lower jaw drops - unhinges a little - as far as the front of the lower lip has to go down, so the lip does not stretch on its own. Other heads ignore these.
tr: 带有“Lower Jaw”骨骼的头部（亚龙人 High Poly Head）：整个下颌会下降——稍微张开——下降幅度与下唇前部需要下移的幅度相同，这样嘴唇不会单独被拉伸。其他头部忽略这些设置。

en: Corners close in at most
tr: 嘴角最多收拢

en: How far the mouth corners may close in towards the shaft's sides. A snout's corners sit far back from the shaft (a cat's mouth line is long), so they need further than the lips. -1 = the same as "Close in round a slim shaft".
tr: 嘴角最多可以向阴茎两侧收拢多远。吻部的嘴角离阴茎较远（猫的嘴线很长），所以需要比嘴唇收拢更多。-1 = 与“围绕细阴茎收拢”相同。

en: Section preset
tr: 本节预设

en: Choose...
tr: 选择...

en: Save section
tr: 保存本节

en: This head back to its defaults
tr: 此头部恢复默认

en: Sets just the sliders in this section: Subtle, Default or Extreme for this head (a head with its own defaults - the Argonian and Khajiit ones - starts from those), or one you saved. Type a name and press "Save section" to keep this section's sliders as a preset for this head, in Data\SKSE\Plugins\DeepFit\Presets\Sections.
tr: 只设置本节的滑块：此头部的轻微、默认或极端（有自己默认值的头部——亚龙人和虎人——以其为基础），或你保存的预设。输入名称并按“保存本节”，即可将本节滑块保存为此头部的预设，位于 Data\SKSE\Plugins\DeepFit\Presets\Sections。

en: How far the lower lip bones may push down past where the jaw left it. Lower it if a gap stays under the shaft (a snout tilted against the shaft reads it taller than it is).
tr: 下唇骨骼在下颌位置之外最多可向下推多远。如果阴茎下方留有缝隙就调低（吻部与阴茎倾斜时会把阴茎读得比实际更粗）。

en: Lower jaw fits the shaft's slope
tr: 下颌贴合阴茎斜度

en: Each lower jaw bone (front, middle, back) finds the underside of the shaft right above it and goes to it, so the front of the jaw bends up onto a shaft that slopes up out of the mouth while the back stays lower. 0 = they only follow the lower lip; 1 = they fit the shaft. Heads with "Lower Jaw" bones only.
tr: 每根下颌骨骼（前、中、后）找到其正上方阴茎的下侧并贴合，使下颌前端向上弯折贴合从嘴里向上倾斜的阴茎，而后部保持较低。0 = 只跟随下唇；1 = 贴合阴茎。仅对带有“Lower Jaw”骨骼的头部有效。

en: Beards follow the lip bones too
tr: 胡须也跟随嘴唇骨骼

en: The lips are mostly pushed by DeepFit's bones, not its morphs: with this the beard over each lip bone moves with it as well, so the moustache and chin beard stay on the lips instead of sinking into them. Takes effect from the next game start.
tr: 嘴唇主要由 DeepFit 的骨骼推动，而不是变形：开启后，每根嘴唇骨骼上方的胡须也会随之移动，使上唇胡和下巴胡须停留在嘴唇上而不是陷进去。下次启动游戏后生效。

en: Open the jaw to the shaft's underside
tr: 下颌张开到阴茎下侧

en: For snouts, where only the lower jaw opens: it drops as far as the underside of the shaft is below the lower lip, not the shaft's whole height. A shaft riding high in the mouth (along the upper teeth) no longer leaves the jaw hanging open far below it.
tr: 适用于只有下颌张开的吻部：下颌只下降到阴茎下侧低于下唇的距离，而不是阴茎的整个高度。阴茎在嘴里位置偏高（贴着上牙）时，下颌不再在其下方张得很大。

en: Tongue pushed down by the shaft
tr: 舌头被阴茎压下

en: Tongue pushed down at most
tr: 舌头最多压下

en: DeepFit's own mouths (the Argonian's): the floor and lower gums of the mouth go down and bend with the lower jaw bones, and the tongue is pushed down where the shaft lies on it. 0 = the tongue stays as it is.
tr: DeepFit 自带的嘴部（亚龙人的）：口腔底部和下牙龈会随下颌骨骼下降和弯折，舌头会在阴茎压着的地方被压下。0 = 舌头保持原样。

en: Opening ease
tr: 张开缓动

en: As the tip goes in, the jaw opens no faster than this many seconds for the whole way, so it does not jump open in one frame (a jerk of the lower jaw on the way in). Too high and a thick part pushes into the lips before the jaw is open. 0 = off; about 0.2-0.35 for a snout.
tr: 插入时，下颌完全张开至少需要这么多秒，不会在一帧内突然张开（插入时下颌抖动）。设得太高时，较粗的部分会在下颌张开前顶进嘴唇。0 = 关闭；吻部约 0.2-0.35。

en: Tongue up to the shaft at most
tr: 舌头最多抬向阴茎

en: Tongue licks
tr: 舌头舔动

en: Licks a second
tr: 每秒舔动次数

en: The tongue stays on the underside of the shaft - pushed down by it, or up to it when it rides high - and licks forward along it, this far and this often, while the shaft is in his mouth. 0 = it lies still.
tr: 舌头贴着阴茎下侧——被它压下，或在它偏高时抬起贴上——并在阴茎在嘴里时按此距离和频率沿着它向前舔动。0 = 静止不动。
