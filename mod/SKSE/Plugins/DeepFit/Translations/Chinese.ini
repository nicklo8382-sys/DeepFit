tr: %.2f 单位

en: %.1f units wider
tr: 宽出 %.1f 单位

en: %.1f s
tr: %.1f 秒

en: Plain
tr: 普通

en: Horse (flare and medial ring)
tr: 马（张开的龟头和中环）

en: Knot
tr: 结

en: Ridged
tr: 带棱

en: Segmented
tr: 分节

en: Guess unknown skeletons
tr: 猜测未知骨架

en: A partner whose skeleton DeepFit does not know: his schlong bones are found from their names (Penis, Dick, Cock, Genital, Shaft, Knot, or the short "XD 2" style many rigs use).
tr: 对于 DeepFit 不认识骨架的伴侣：根据骨骼名称找出其阴茎骨骼（Penis、Dick、Cock、Genital、Shaft、Knot，或许多骨架使用的简短 "XD 2" 形式）。

en: Anything at his lips counts
tr: 唇边的任何部分都算

en: Last resort for a partner where nothing is found at all: any part of his mesh that reaches the lips opens the mouth and fills the throat. Heavier, and his body near the face can be read too - leave it off unless you need it.
tr: 完全找不到任何部位时的最后手段：他的网格中任何碰到嘴唇的部分都会张开嘴并填充喉咙。开销更大，且靠近脸部的身体部位也可能被读取——除非需要，请保持关闭。

en: What DeepFit found
tr: DeepFit 的识别结果

en: Nothing yet - it shows here once a shaft is in a fitted mouth.
tr: 暂无——当阴茎进入已适配的嘴中时会显示在这里。

en: (%.0f s ago)
tr: （%.0f 秒前）

en: How the last partner was read: a skeleton DeepFit knows, bones it guessed from their names (listed), or anything at his lips; and whether the shaft came from his mesh or was built round his bones. If a guessed one looks wrong, this is why.
tr: 上一个伴侣是如何被识别的：DeepFit 认识的骨架、根据名称猜测的骨骼（已列出），或唇边的任何部分；以及阴茎是读取自他的网格还是围绕骨骼构建的。如果猜测结果看起来不对，原因就在这里。

en: Strength for
tr: 强度：

en: Scales how wide the mouth opens and how much the throat bulges for every partner of this race (1 = as the sliders below say). Saved per race in DeepFit.ini (RaceStrength).
tr: 按此种族的所有伴侣缩放嘴张开的宽度和喉咙鼓起的程度（1 = 按下方滑块）。按种族保存在 DeepFit.ini（RaceStrength）中。

en: Races set:
tr: 已设置的种族：

en: Clear races
tr: 清除种族

en: Lips drag with the stroke
tr: 嘴唇随抽动拖动

en: His lips roll out a little as the shaft pulls back and tuck in as it pushes in. 0 = off.
tr: 阴茎后退时他的嘴唇略微外翻，推入时内收。0 = 关闭。

en: Stroke speed for full drag
tr: 完全拖动所需的抽动速度

en: Face
tr: 面部

en: His face reacts
tr: 面部反应

en: His eyes close and his brows lift the deeper it goes; in a gag his eyes clench and his brows knit. Goes over OStim's own expression, never below it.
tr: 越深他的眼睛越闭、眉毛越抬；作呕时眼睛紧闭、眉头紧皱。叠加在 OStim 自身表情之上，不会低于它。

en: Eyes close with depth
tr: 随深度闭眼

en: Brows lift with depth
tr: 随深度抬眉

en: Clench in a gag
tr: 作呕时紧闭

en: After he pulls out
tr: 拔出之后

en: Mouth stays open for
tr: 嘴保持张开

en: After the shaft leaves his mouth it stays a little open for a moment before it closes. 0 = closes straight away.
tr: 阴茎离开嘴后，嘴会微张片刻再合上。0 = 立即合上。

en: How open it stays
tr: 保持张开的程度

en: Then he swallows
tr: 然后吞咽

en: Gags and swallows by themselves
tr: 自动作呕和吞咽

en: DeepFit makes him gag on a fast, deep thrust and swallow when it is held deep. When Anatomica sends its own gags and gulps, those are used instead.
tr: 快速深入时 DeepFit 会让他作呕，深处停留时会让他吞咽。当 Anatomica 发送自己的作呕和吞咽时，改用 Anatomica 的。

en: Deep is past the throat's top by
tr: 超过喉咙顶部多少算深

en: Gag at a thrust of
tr: 作呕的抽动速度

en: Time between gags
tr: 作呕间隔

en: Swallow when held deep for
tr: 深处停留多久后吞咽

en: Move the teeth:
tr: 移动牙齿：

en: Moves his teeth a little down and back so they sit clear of the shaft. They are hung on a node of DeepFit's own under his head, so the game rebuilding his face does not undo it for long - DeepFit checks once a second and puts them back. Always: kept moved outside scenes too, only on the men DeepFit fits, and only when this is chosen (it costs next to nothing).
tr: 将他的牙齿略微向下、向后移动，避开阴茎。牙齿挂在 DeepFit 自己位于头部下的节点上，因此游戏重建面部也不会让它长时间失效——DeepFit 每秒检查一次并重新挂上。始终：场景外也保持移动，仅限 DeepFit 适配的男性，且仅在选择此项时生效（几乎没有开销）。

en: Teeth down
tr: 牙齿向下

en: Teeth back
tr: 牙齿向后

en: Off
tr: 关闭

en: While the mouth is full
tr: 嘴里有东西时

en: Always (kept moved)
tr: 始终（保持移动）

en: %.0f units/s
tr: %.0f 单位/秒

en: Show it
tr: 显示

en: A plain schlong is shown in his mouth where the test one is (only its thickness and depth - the shapes below are felt by the mouth and throat, not drawn).
tr: 在测试阴茎的位置于他嘴中显示一根普通阴茎（只体现粗细和深度——下方的形状只影响嘴和喉咙，不会画出来）。

en: Size:
tr: 尺寸：

en: Sliders
tr: 滑块

en: Mine (TNG)
tr: 我的（TNG）

en: A plain schlong the size of one of TNG's size categories (scaled as set in TNG's MCM), or of the player's own TNG size. Sliders: the height, width and shape below.
tr: 一根普通阴茎，大小取自 TNG 的某个尺寸档（按 TNG MCM 中的设置缩放），或玩家自己的 TNG 尺寸。滑块：使用下方的高度、宽度和形状。

en: Your TNG size: %s (x%.2f)%s
tr: 你的 TNG 尺寸：%s（x%.2f）%s

en:  - TNG did not answer, M used
tr:  ——TNG 未响应，使用 M

en: Lower lip up
tr: 下唇上推

en: While the mouth is full the lower lip is pushed up this far (its middle fully, the sides a little less), closer round the shaft.
tr: 嘴里有东西时，下唇向上推这么远（中间全额，两侧略少），更贴合阴茎。

en: Open to the shaft's real thickness
tr: 按阴茎实际粗细张嘴

en: The mouth opens to the shaft measured straight across it. Off: measured straight up and down his face, so a shaft going in at an angle opens it wider (as before 0.4.1).
tr: 嘴按垂直于阴茎方向测得的粗细张开。关闭：沿脸部上下方向测量，斜着进入的阴茎会让嘴张得更大（0.4.1 之前的做法）。

en: Bump
tr: 凸起

en: Bump along it
tr: 凸起位置

en: %.2f (0 base, 1 tip)
tr: %.2f（0 根部，1 尖端）

en: Bump size
tr: 凸起大小

en: x%.2f thicker
tr: 粗 x%.2f

en: Stroke speed
tr: 抽动速度

en: %.2f a second
tr: 每秒 %.2f 次

en: Stroke length
tr: 抽动长度

en: %.2f of the depth
tr: 深度的 %.2f

en: Enters higher
tr: 进入点上移

en: Enters to his right
tr: 进入点右移

en: Tip up
tr: 尖端向上

en: Tip to his right
tr: 尖端向右

en: Places and angles the test schlong in his mouth (negative = lower / to his left / tip down). The lips, cheeks and throat fit it where it is, the same as a real one.
tr: 调整测试阴茎在嘴中的位置和角度（负值 = 更低 / 向他左边 / 尖端向下）。嘴唇、脸颊和喉咙会像对真实阴茎一样贴合它。

en: Centre it
tr: 居中

en: %.0f degrees
tr: %.0f 度

en: Tilt my head back
tr: 头向后仰

en: Tilts the player's head back (chin up) while testing, so the throat bulge is easier to see.
tr: 测试时让玩家的头向后仰（抬下巴），更容易看到喉咙鼓起。

en: MFEE's limit (its ini): %.0f
tr: MFEE 的上限（其 ini）：%.0f

en: Raise MFEE's limit to 300
tr: 将 MFEE 上限提高到 300

en: Put MFEE's limit back to 100
tr: 将 MFEE 上限改回 100

en: MFEE's limit is changed in its ini - restart the game for it to take effect (MFEE only reads it at start).
tr: MFEE 的上限已在其 ini 中修改——需要重启游戏才能生效（MFEE 只在启动时读取）。

en: MFEE has no way to change its limit while the game runs: the button writes it to MFEE's ini, and it takes effect after a restart. It is MFEE's limit for every morph it drives, not only DeepFit's.
tr: MFEE 无法在游戏运行时更改上限：此按钮会写入 MFEE 的 ini，重启后生效。这是 MFEE 对其驱动的所有变形的上限，不只是 DeepFit 的。

en: A plain schlong the size of one of TNG's size categories, or of the player's own TNG size. Each size uses your TNG size modifier for it - the multiplier set for that size in TNG's MCM (0.8 / 0.9 / 1.0 / 1.2 / 1.4 as TNG installs them); TNG's per-race multipliers are not included. Sliders: the height, width and shape below.
tr: 一根普通阴茎，大小取自 TNG 的某个尺寸档，或玩家自己的 TNG 尺寸。每个尺寸使用你的 TNG 尺寸修正值——即 TNG MCM 中该尺寸的倍数（TNG 默认 0.8 / 0.9 / 1.0 / 1.2 / 1.4）；不包括 TNG 的按种族倍数。滑块：使用下方的高度、宽度和形状。

en: Sizes follow your TNG size modifiers (TNG's MCM).
tr: 尺寸遵循你的 TNG 尺寸修正值（TNG 的 MCM）。

en: The whole scene
tr: 整个场景

en: Moves his teeth a little down and back so they sit clear of the shaft, only in scenes: while his mouth is full, or the whole time a partner's schlong is near him. Outside scenes they are put back exactly where the game has them. If the game rebuilds his face mid-scene, DeepFit moves them again within a second.
tr: 仅在场景中将他的牙齿略微向下、向后移动，避开阴茎：嘴里有东西时，或伴侣的阴茎在他附近的整个期间。场景外牙齿会精确回到游戏原本的位置。如果游戏在场景中重建了他的面部，DeepFit 会在一秒内再次移动牙齿。

en: Sets the mouth, lips, cheeks, throat, swallow / gag, face and lip-drag sliders together - Default is the tuned set, Subtle softer, Extreme stronger. Fine-tune them below afterwards. Teeth placement and what DeepFit reads are left as they are.
tr: 一次性设置嘴、嘴唇、脸颊、喉咙、吞咽/作呕、面部和嘴唇拖动滑块——默认为调好的一组，轻微更柔和，极端更强烈。之后可在下方微调。牙齿位置和 DeepFit 的读取方式保持不变。

en: Follow PPA's aim into his mouth
tr: 跟随 PPA 对准嘴部

en: PPA bends the partner's schlong into his mouth after DeepFit has read where the animation put it. When an animation leaves it a few units off (under his chin), the mouth stayed shut although on screen it was in. On: a shaft whose line passes close by his lips is turned onto them, the way PPA aims it.
tr: PPA 会在 DeepFit 读取动画位置之后才把伴侣的阴茎弯进他嘴里。当动画让它偏离几个单位（在下巴下方）时，即使画面上已经进嘴，嘴也不会张开。开启：轴线从嘴唇附近经过的阴茎会像 PPA 那样被转向嘴唇。

en: Aim when it passes within
tr: 在以下距离内时对准

en: %.1f units of his lips
tr: 距嘴唇 %.1f 单位

en: Turn it at most
tr: 最多转动

en: Built in:
tr: 内置：

en: Your presets:
tr: 你的预设：

en: none yet
tr: 暂无

